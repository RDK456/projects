<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RDK456 Projects</title>
<meta name="description" content="Android and Windows apps by RDK456 with live release notes and downloads from GitHub: 1 download manager, ThermalScope, Forget-it and AppDash.">
<meta property="og:title" content="RDK456 Projects">
<meta property="og:description" content="Apps I build and keep shipping, with live GitHub releases, screenshots and downloads.">
<meta property="og:type" content="website">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0709">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%89%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top" id="topbar">
  <a class="logo" href="#" aria-label="RDK456 projects, home">RDK456</a>
  <nav id="nav" aria-label="Browse"></nav>
  <div class="tools">
    <form class="search" id="searchbox" role="search">
      <button type="button" id="searchbtn" class="icon-btn" aria-label="Search apps"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg></button>
      <input id="q" type="search" placeholder="Apps, platforms, languages" aria-label="Search apps" autocomplete="off">
    </form>
    <span class="status" id="status" role="status" aria-live="polite"><i></i><span>Loading</span></span>
  </div>
</header>

<main>
  <section class="billboard" id="billboard" aria-roledescription="carousel" aria-label="Featured apps"></section>
  <div id="rows"></div>
  <p class="empty" id="empty" hidden>No apps match that search. Try a platform such as Android or Windows.</p>
</main>

<footer>
  <p>Release data is read from the GitHub API on every visit. <a href="https://github.com/RDK456" target="_blank" rel="noopener">github.com/RDK456</a> &nbsp; <a href="https://rdk456.github.io/" target="_blank" rel="noopener">Portfolio</a></p>
</footer>

<dialog id="modal" aria-label="App details"></dialog>
<dialog id="lightbox"><button type="button" class="icon-btn close" aria-label="Close image">&times;</button><img alt=""></dialog>
<noscript><p style="padding:6rem 2rem">This page needs JavaScript to load release data. See <a href="https://github.com/RDK456">github.com/RDK456</a>.</p></noscript>
<script src="app.js"></script>
<script src="dist/enhance.js" defer></script>
</body>
</html>
